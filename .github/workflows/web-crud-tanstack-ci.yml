name: web-crud-tanstack ci

on:
  push:
    branches: [main]
    paths: ["web-crud-tanstack/**", ".github/workflows/web-crud-tanstack-ci.yml"]
  pull_request:
    paths: ["web-crud-tanstack/**", ".github/workflows/web-crud-tanstack-ci.yml"]

defaults:
  run:
    working-directory: web-crud-tanstack

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-crud-tanstack/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run fmt:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-crud-tanstack/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web-crud-tanstack/playwright-report
          retention-days: 7

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pulgarcito Login</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      section {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 16px;
        margin-bottom: 16px;
      }
      input,
      button,
      select {
        display: block;
        width: 100%;
        margin: 4px 0 12px;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        background: #0066cc;
        color: white;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      button.secondary {
        background: #666;
      }
      pre {
        background: #f4f4f4;
        padding: 8px;
        border-radius: 4px;
        overflow-x: auto;
        word-break: break-all;
        white-space: pre-wrap;
      }
      .error {
        color: #c00;
        min-height: 1.2em;
      }
      .warning {
        background: #fff3cd;
        border: 1px solid #ffc107;
        color: #856404;
        padding: 8px 12px;
        border-radius: 4px;
        margin: 8px 0;
        font-size: 14px;
      }
      .warning button {
        width: auto;
        padding: 4px 10px;
        margin: 6px 0 0;
        font-size: 12px;
        background: #856404;
      }
      .hidden {
        display: none;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 8px 0 0;
        font-size: 14px;
      }
      ul li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid #eee;
      }
      ul li:last-child {
        border-bottom: 0;
      }
      ul li .info {
        flex: 1;
        min-width: 0;
        word-break: break-all;
      }
      ul li code {
        background: #f4f4f4;
        padding: 1px 4px;
        border-radius: 3px;
      }
      ul li .err {
        color: #c00;
      }
      ul li button.del {
        width: auto;
        padding: 2px 10px;
        margin: 0;
        font-size: 12px;
        background: #c00;
      }
    </style>
  </head>
  <body>
    <h1>Pulgarcito Login</h1>

    <section id="auth-section">
      <h2>Sign in / Sign up</h2>
      <input id="email" type="email" placeholder="email" autocomplete="email" />
      <input id="password" type="password" placeholder="password" autocomplete="current-password" />
      <input id="name" type="text" placeholder="name (sign-up only)" />
      <button id="signin">Sign in</button>
      <button id="signup" class="secondary">Sign up</button>
      <div id="auth-error" class="error"></div>
    </section>

    <section id="session-section" class="hidden">
      <h2>Session</h2>
      <p>Logged in as <strong id="session-email"></strong></p>
      <div id="verify-warning" class="warning hidden">
        <strong>Email not verified.</strong> Check your inbox for the verification link.
        <button id="resend-verify">Resend verification email</button>
      </div>
      <button id="signout" class="secondary">Sign out</button>
    </section>

    <section id="key-section" class="hidden">
      <h2>API Keys</h2>
      <label for="key-expires">Expires in</label>
      <select id="key-expires">
        <option value="7">7 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="">Never</option>
      </select>
      <button id="create-key">Create API key</button>
      <pre id="key-output"></pre>

      <h3>Existing</h3>
      <button id="refresh-keys" class="secondary">Refresh list</button>
      <ul id="key-list"></ul>
    </section>

    <script>
      const LOG = (...a) => console.log("[pulgarcito]", ...a);
      const WARN = (...a) => console.warn("[pulgarcito]", ...a);
      const ERR = (...a) => console.error("[pulgarcito]", ...a);

      LOG("script start, DOM state:", document.readyState);
      window.addEventListener("error", (e) => ERR("unhandled error:", e.error || e.message));
      window.addEventListener("unhandledrejection", (e) => ERR("unhandled rejection:", e.reason));

      const $ = (id) => document.getElementById(id);
      const show = (id, on) => $(id).classList.toggle("hidden", !on);

      async function call(path, body) {
        LOG("call() →", path, body);
        let res;
        try {
          res = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        } catch (e) {
          ERR("call() network error for", path, e);
          throw e;
        }
        LOG("call() ←", path, res.status, res.statusText);
        if (!res.ok) {
          const text = await res.text();
          ERR("call() non-OK body for", path, ":", text);
          throw new Error(`${res.status}: ${text}`);
        }
        const json = await res.json();
        LOG("call() body for", path, ":", json);
        return json;
      }

      async function refresh() {
        LOG("refresh() start");
        let data = null;
        try {
          const r = await fetch("/api/auth/get-session");
          LOG("get-session status:", r.status);
          if (r.ok) data = await r.json();
        } catch (e) {
          ERR("get-session threw:", e);
        }
        LOG("get-session data:", data);
        if (data?.user) {
          $("session-email").textContent = data.user.email;
          LOG("user email set to", data.user.email, "verified?", data.user.emailVerified);
          show("verify-warning", !data.user.emailVerified);
          show("session-section", true);
          show("key-section", true);
          show("auth-section", false);
        } else {
          LOG("no user — showing auth form");
          show("session-section", false);
          show("key-section", false);
          show("auth-section", true);
        }
        LOG("refresh() done");
      }

      const resendBtn = $("resend-verify");
      LOG("resend-verify element at script load:", resendBtn);
      if (resendBtn) {
        resendBtn.onclick = async () => {
          LOG("[resend] click handler entered");
          const email = $("session-email").textContent;
          LOG("[resend] email from session:", JSON.stringify(email));
          if (!email) {
            WARN("[resend] no email in session, bailing");
            alert("No email in session — sign in again.");
            return;
          }
          const btn = $("resend-verify");
          const original = btn.textContent;
          LOG("[resend] original label:", original);
          btn.disabled = true;
          btn.textContent = "Sending…";
          LOG("[resend] label changed to Sending…, calling endpoint");
          try {
            await call("/api/auth/send-verification-email", { email, callbackURL: "/login" });
            LOG("[resend] call resolved, setting label to 'Sent - check inbox'");
            btn.textContent = "Sent - check inbox";
          } catch (e) {
            ERR("[resend] call threw:", e);
            alert(`Resend failed: ${e.message}`);
            btn.textContent = original;
            btn.disabled = false;
            LOG("[resend] label restored to", original);
          }
        };
        LOG("resend-verify onclick attached");
      } else {
        ERR("resend-verify element NOT FOUND at script load — handler NOT attached");
      }

      $("signin").onclick = async () => {
        LOG("[signin] click");
        $("auth-error").textContent = "";
        try {
          await call("/api/auth/sign-in/email", { email: $("email").value, password: $("password").value });
          LOG("[signin] success");
          await refresh();
        } catch (e) {
          ERR("[signin] failed:", e);
          $("auth-error").textContent = e.message;
        }
      };

      $("signup").onclick = async () => {
        LOG("[signup] click");
        $("auth-error").textContent = "";
        try {
          await call("/api/auth/sign-up/email", {
            email: $("email").value,
            password: $("password").value,
            name: $("name").value || $("email").value,
          });
          LOG("[signup] success");
          await refresh();
        } catch (e) {
          ERR("[signup] failed:", e);
          $("auth-error").textContent = e.message;
        }
      };

      $("signout").onclick = async () => {
        LOG("[signout] click");
        try {
          await call("/api/auth/sign-out", {});
        } catch (e) {
          ERR("[signout] failed:", e);
        }
        await refresh();
      };

      $("create-key").onclick = async () => {
        LOG("[create-key] click");
        $("key-output").textContent = "creating…";
        try {
          const days = $("key-expires").value;
          const body = { name: "dev" };
          if (days) body.expiresIn = Number(days) * 86400;
          const data = await call("/api/auth/api-key/create", body);
          LOG("[create-key] got key, prefix:", (data.key || "").slice(0, 6));
          $("key-output").textContent = data.key;
          await loadKeys();
        } catch (e) {
          ERR("[create-key] failed:", e);
          $("key-output").textContent = e.message;
        }
      };

      $("refresh-keys").onclick = loadKeys;

      async function loadKeys() {
        LOG("[loadKeys] start");
        const ul = $("key-list");
        ul.innerHTML = "<li>loading…</li>";
        try {
          const res = await fetch("/api/auth/api-key/list");
          LOG("[loadKeys] status:", res.status);
          if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
          const { apiKeys } = await res.json();
          LOG("[loadKeys] got", apiKeys?.length ?? 0, "keys");
          if (!apiKeys?.length) {
            ul.innerHTML = "<li><em>no keys yet</em></li>";
            return;
          }
          ul.innerHTML = apiKeys
            .map((k) => {
              const id = esc(k.start ?? k.prefix ?? "…");
              const created = k.createdAt ? new Date(k.createdAt).toLocaleDateString() : "?";
              const expires = k.expiresAt ? new Date(k.expiresAt).toLocaleString() : "never";
              const name = k.name ? esc(k.name) : "<em>unnamed</em>";
              return `<li><span class="info"><code>${id}</code> · ${name} · created ${created} · expires ${expires}</span><button class="del" data-key-id="${esc(k.id)}">Delete</button></li>`;
            })
            .join("");
        } catch (e) {
          ERR("[loadKeys] failed:", e);
          ul.innerHTML = `<li class="err">${e.message}</li>`;
        }
      }

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );

      $("key-list").addEventListener("click", async (e) => {
        LOG("[key-list] click", e.target.tagName);
        const btn = e.target.closest("button.del");
        if (!btn) return;
        const keyId = btn.dataset.keyId;
        LOG("[delete] keyId:", keyId);
        if (!confirm("Delete this API key? Any client using it will lose access immediately.")) return;
        btn.disabled = true;
        try {
          await call("/api/auth/api-key/delete", { keyId });
          LOG("[delete] success");
          await loadKeys();
        } catch (err) {
          ERR("[delete] failed:", err);
          alert(err.message);
          btn.disabled = false;
        }
      });

      LOG("script end, calling refresh()");
      refresh();
    </script>
  </body>
</html>

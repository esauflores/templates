[project]
name = "python-uv-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7,<8",
    "loguru>=0.7,<1",
    "numpy>=2",
    "pillow>=10,<13",
    "scikit-learn>=1.5,<2",
    "tqdm>=4.66,<5",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
# Pick one: `uv sync --extra cpu` (local) or `uv sync --extra cu126` (NVIDIA GPU).
cpu = ["torch>=2.5,<3", "torchvision>=0.20,<1"]
cu126 = ["torch>=2.5,<3", "torchvision>=0.20,<1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
